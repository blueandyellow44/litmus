<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LITMUS · What happened, and how each outlet told it.</title>
    <meta name="description" content="What happened, and how each outlet told it. LITMUS groups the news into stories and shows every outlet that covered each one, where its report leans and how calmly or hotly it was told." />
    <meta name="theme-color" content="#F1F0ED" />
    <!-- Link previews (Facebook, LinkedIn, iMessage, X). Crawlers do not run
         the app, so these must be static and absolute. The image is rendered by
         design/og-image-2026-10-03/og-v4.py. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LITMUS" />
    <meta property="og:url" content="https://litmustimes.com/" />
    <meta property="og:title" content="LITMUS · What happened, and how each outlet told it." />
    <meta property="og:description" content="LITMUS groups the news into stories and shows every outlet that covered each one, where its report leans and how calmly or hotly it was told." />
    <meta property="og:image" content="https://litmustimes.com/og-image-v4.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three stories, each headlined calmly by one outlet and hotly by another: Time 1.0 and Breitbart 3.9 on the UK terror-plot arrests, Axios 1.7 and The Atlantic 3.8 on OpenAI's AI agents, NBC News 1.5 and the New York Post 3.5 on Bill Gates and AI." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LITMUS · What happened, and how each outlet told it." />
    <meta name="twitter:description" content="Every outlet on each story, where its report leans and how calmly or hotly it was told." />
    <meta name="twitter:image" content="https://litmustimes.com/og-image-v4.png" />
    <!-- The favicon is the ramp mark alone (Quiet Reader brand.md section 1). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Newsreader carries what a person reads, Instrument Sans what a person
         scans. Both have system fallbacks in tailwind.config.js and tokens.css,
         so a blocked request degrades the faces, not the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
